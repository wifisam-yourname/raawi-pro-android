name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and extract ZIP file
      run: |
        echo "Searching for zip file..."
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Error: No ZIP file found in the repository root!"
          exit 1
        fi
        echo "Found ZIP file: $ZIP_FILE"
        echo "Extracting project..."
        unzip -q "$ZIP_FILE" -d extracted_project
        cd extracted_project
        SUB_DIR=$(find . -maxdepth 2 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        if [ -n "$SUB_DIR" ]; then
          cd $(dirname "$SUB_DIR")
        fi
        echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Build with Gradle
      run: |
        cd $PROJECT_DIR
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
